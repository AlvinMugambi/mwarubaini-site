  <div id="root"></div>

  <script>
  /* ── Plain JS Matter.js physics — completely outside React ── */
  var physicsStarted = false;
  function startPhysics() {
    var canvas = document.getElementById('physics-hero-canvas');
    if (!canvas || !window.Matter) {
      setTimeout(startPhysics, 100);
      return;
    }
    if (physicsStarted) return;
    physicsStarted = true;
    var accentColor = canvas.dataset.cyan  || '#22d3ee';
    var accentGreen = canvas.dataset.green || '#4ade80';

    var M = window.Matter;
    var Engine = M.Engine, Bodies = M.Bodies, Body = M.Body, World = M.World;

    var W = window.innerWidth;
    var H = window.innerHeight;
    canvas.width  = W;
    canvas.height = H;

    var engine = Engine.create({ gravity: { x: 0, y: 0.22 } });
    var world  = engine.world;
    var ctx    = canvas.getContext('2d');

    var solutions = [
      'Software Dev', 'Web & App', 'Data & Analytics',
      'AI & ML', 'Cloud & Infra', 'Cybersecurity', 'Consulting'
    ];
    var palette = [accentColor, accentGreen];

    var wo = { isStatic: true };
    World.add(world, [
      Bodies.rectangle(W/2, H+30,  W*2, 60, wo),
      Bodies.rectangle(W/2, -30,   W*2, 60, wo),
      Bodies.rectangle(-30,  H/2,  60, H*2, wo),
      Bodies.rectangle(W+30, H/2,  60, H*2, wo),
    ]);

    var leaves = solutions.map(function(label, i) {
      var r = 52 + Math.random() * 24;
      var b = Bodies.circle(
        100 + Math.random() * (W - 200),
        -60 - i * 120, r,
        { restitution:0.5, friction:0.01, frictionAir:0.009,
          density:0.0012, label: label,
          plugin:{ color: palette[i % 2], r: r } }
      );
      Body.setVelocity(b, { x:(Math.random()-0.5)*3, y:Math.random()*2+0.5 });
      return b;
    });
    World.add(world, leaves);

    var mouse = { x: -9999, y: -9999 };
    canvas.addEventListener('mousemove', function(e) {
      var rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('mouseleave', function() {
      mouse.x = -9999; mouse.y = -9999;
    });

    function draw() {
      requestAnimationFrame(draw);
      // Re-fetch live canvas each frame in case React replaced the element
      var liveCanvas = document.getElementById('physics-hero-canvas');
      if (liveCanvas && liveCanvas !== canvas) {
        canvas = liveCanvas;
        canvas.width = W; canvas.height = H;
        ctx = canvas.getContext('2d');
      }
      if (!ctx) return;
      Engine.update(engine, 1000/60);

      for (var i = 0; i < leaves.length; i++) {
        var b = leaves[i];
        var dx = b.position.x - mouse.x;
        var dy = b.position.y - mouse.y;
        var d  = Math.sqrt(dx*dx + dy*dy);
        if (d < 130 && d > 0.1) {
          var s = ((130-d)/130) * 0.007;
          Body.applyForce(b, b.position, { x:(dx/d)*s, y:(dy/d)*s });
        }
      }

      ctx.clearRect(0, 0, W, H);

      for (var j = 0; j < leaves.length; j++) {
        var leaf = leaves[j];
        var x = leaf.position.x, y = leaf.position.y;
        var col = leaf.plugin.color;
        var r   = leaf.plugin.r;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(leaf.angle);

        var g = ctx.createRadialGradient(0,0,r*0.2, 0,0,r*1.4);
        g.addColorStop(0, col+'28'); g.addColorStop(1, col+'00');
        ctx.beginPath(); ctx.arc(0,0,r*1.4,0,Math.PI*2);
        ctx.fillStyle=g; ctx.fill();

        ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
        ctx.fillStyle=col+'18'; ctx.fill();
        ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();

        ctx.beginPath(); ctx.arc(0,0,r*0.52,0,Math.PI*2);
        ctx.strokeStyle=col+'30'; ctx.lineWidth=0.8; ctx.stroke();

        ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2);
        ctx.fillStyle=col+'cc'; ctx.fill();

        var fs = Math.round(r * 0.21);
        ctx.fillStyle=col;
        ctx.font='700 '+fs+"px 'Syne', sans-serif";
        ctx.textAlign='center'; ctx.textBaseline='middle';
        var words = leaf.label.split(' ');
        var lh = fs * 1.3;
        if (words.length === 1) {
          ctx.fillText(words[0], 0, 0);
        } else {
          var mid = Math.ceil(words.length/2);
          ctx.fillText(words.slice(0,mid).join(' '), 0, -lh*0.5);
          ctx.fillText(words.slice(mid).join(' '),   0,  lh*0.5);
        }

        ctx.restore();
      }
    }

    requestAnimationFrame(draw);
  }

  // Wait for React to mount the canvas, then start physics
  setTimeout(startPhysics, 500);
  </script>
